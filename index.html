<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SourceCode Extractor - DevTools Suite</title>
    <!-- Font Inter & Fira Code -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Prism.js CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

    <style>
        :root {
            --bg-main: #0F172A;
            --bg-card: #111827;
            --bg-sidebar: #0B0F19;
            --accent-primary: #7C3AED;
            --accent-secondary: #A855F7;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --border-glass: rgba(255, 255, 255, 0.08);
            --glow-purple: rgba(124, 58, 237, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-card);
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }

        /* Layout Structure */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            padding: 20px 15px;
            z-index: 10;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at top right, rgba(124, 58, 237, 0.08), transparent 40%);
            overflow: hidden;
        }

        /* Brand Header */
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #FFF;
            margin-bottom: 25px;
            padding-left: 5px;
        }
        .brand i {
            color: var(--accent-secondary);
            font-size: 1.4rem;
            filter: drop-shadow(0 0 8px var(--accent-primary));
        }

        /* Form Search URL */
        .search-box {
            display: flex;
            gap: 10px;
            padding: 15px 25px;
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
        }
        .input-wrapper {
            flex: 1;
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        .search-input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            color: #FFF;
            outline: none;
            transition: all 0.3s;
        }
        .search-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 12px var(--glow-purple);
        }
        .btn-extract {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #FFF;
            border: none;
            padding: 0 22px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-extract:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px var(--glow-purple);
            transform: translateY(-1px);
        }

        /* Stats Cards */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 15px 25px;
        }
        .stat-card {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .stat-card .val {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-secondary);
        }
        .stat-card .label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Code Editor Tabs & Container */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin: 0 25px 20px 25px;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .tab-bar {
            display: flex;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid var(--border-glass);
            justify-content: space-between;
            align-items: center;
            padding-right: 10px;
        }
        .tabs {
            display: flex;
        }
        .tab {
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab.active {
            color: #FFF;
            background: rgba(124, 58, 237, 0.1);
            border-bottom-color: var(--accent-primary);
        }
        .tab-actions {
            display: flex;
            gap: 8px;
        }
        .btn-action {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-action:hover {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        /* Code Display Area */
        .code-wrapper {
            flex: 1;
            position: relative;
            overflow: auto;
        }
        pre[class*="language-"] {
            margin: 0;
            height: 100%;
            background: transparent !important;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
        }
        code[class*="language-"] {
            font-family: 'Fira Code', monospace;
        }

        .filter-code-input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-glass);
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            outline: none;
        }

        /* Preview Tab Section */
        #preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #FFF;
        }

        /* History Panel */
        .history-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }
        .history-item {
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
        }
        .history-item:hover {
            background: rgba(124, 58, 237, 0.15);
            color: #FFF;
        }

        /* Loading & Empty Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            gap: 15px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(124, 58, 237, 0.2);
            border-top-color: var(--accent-secondary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; }
            .stats-bar { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">
            <i class="fa-solid fa-code"></i>
            <span>SourceExtractor</span>
        </div>
        <div class="history-title">
            <span>Riwayat Scan</span>
            <i class="fa-solid fa-trash-can" id="btn-clear-history" style="cursor: pointer;" title="Hapus Riwayat"></i>
        </div>
        <ul class="history-list" id="history-list">
            <!-- Item Riwayat -->
        </ul>
    </div>

    <!-- Main Section -->
    <div class="main-content">
        <!-- Header / URL Input -->
        <div class="search-box">
            <div class="input-wrapper">
                <i class="fa-solid fa-globe"></i>
                <input type="url" id="target-url" class="search-input" placeholder="Masukkan URL Website (contoh: https://example.com)..." required>
            </div>
            <button class="btn-extract" id="btn-extract">
                <i class="fa-solid fa-bolt"></i> Extract
            </button>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-card">
                <div>
                    <div class="label">File CSS Extracted</div>
                    <div class="val" id="stat-css">0</div>
                </div>
                <i class="fa-brands fa-css3-alt fa-2x" style="color: #38BDF8;"></i>
            </div>
            <div class="stat-card">
                <div>
                    <div class="label">File JS Extracted</div>
                    <div class="val" id="stat-js">0</div>
                </div>
                <i class="fa-brands fa-square-js fa-2x" style="color: #FACC15;"></i>
            </div>
            <div class="stat-card">
                <div>
                    <div class="label">Ukuran Total</div>
                    <div class="val" id="stat-size">0 KB</div>
                </div>
                <i class="fa-solid fa-database fa-2x" style="color: var(--accent-secondary);"></i>
            </div>
        </div>

        <!-- Editor & Viewer -->
        <div class="editor-container">
            <div class="tab-bar">
                <div class="tabs">
                    <button class="tab active" data-tab="html"><i class="fa-brands fa-html5"></i> HTML</button>
                    <button class="tab" data-tab="css"><i class="fa-brands fa-css3-alt"></i> CSS</button>
                    <button class="tab" data-tab="js"><i class="fa-brands fa-js"></i> JavaScript</button>
                    <button class="tab" data-tab="preview"><i class="fa-solid fa-eye"></i> Live Preview</button>
                </div>
                <div class="tab-actions">
                    <input type="text" id="search-code" class="filter-code-input" placeholder="Cari kode...">
                    <button class="btn-action" id="btn-copy"><i class="fa-regular fa-copy"></i> Copy</button>
                    <button class="btn-action" id="btn-download-single"><i class="fa-solid fa-download"></i> Download Tab</button>
                    <button class="btn-action" id="btn-download-zip" style="background: var(--accent-primary);"><i class="fa-solid fa-file-zipper"></i> ZIP All</button>
                </div>
            </div>

            <div class="code-wrapper" id="code-wrapper">
                <div class="overlay" id="overlay-status">
                    <i class="fa-solid fa-terminal fa-3x" style="color: var(--accent-secondary);"></i>
                    <p style="color: var(--text-muted);">Masukkan URL dan klik "Extract" untuk mengambil source code.</p>
                </div>

                <div class="overlay hidden" id="overlay-loading">
                    <div class="spinner"></div>
                    <p style="color: var(--text-main); font-weight: 600;">Sedang Mengambil Source Code...</p>
                </div>

                <pre class="line-numbers"><code class="language-html" id="code-display"></code></pre>
                <iframe id="preview-frame" class="hidden"></iframe>
            </div>
        </div>
    </div>

    <!-- External Libs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script>
        // App State
        let currentData = { html: '', css: '', js: '' };
        let activeTab = 'html';

        // Elements
        const btnExtract = document.getElementById('btn-extract');
        const urlInput = document.getElementById('target-url');
        const codeDisplay = document.getElementById('code-display');
        const previewFrame = document.getElementById('preview-frame');
        const overlayStatus = document.getElementById('overlay-status');
        const overlayLoading = document.getElementById('overlay-loading');
        const searchInput = document.getElementById('search-code');
        const historyList = document.getElementById('history-list');

        // Initial Load
        renderHistory();

        // Event Extraction
        btnExtract.addEventListener('click', extractSourceCode);
        urlInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') extractSourceCode(); });

        async function extractSourceCode() {
            const url = urlInput.value.trim();
            if (!url) return alert('Silakan masukkan URL terlebih dahulu!');

            showLoading(true);

            try {
                const res = await fetch('/api/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Terjadi kesalahan server.');

                currentData = data;
                
                // Update Stats
                document.getElementById('stat-css').innerText = data.stats.cssCount;
                document.getElementById('stat-js').innerText = data.stats.jsCount;
                document.getElementById('stat-size').innerText = data.stats.size;

                // Update LocalStorage
                saveHistory(url);

                // Render Content
                switchTab(activeTab);
                overlayStatus.classList.add('hidden');

            } catch (err) {
                alert(err.message);
            } finally {
                showLoading(false);
            }
        }

        // Tab Switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                activeTab = tab.dataset.tab;
                switchTab(activeTab);
            });
        });

        function switchTab(tabType) {
            if (tabType === 'preview') {
                codeDisplay.parentElement.classList.add('hidden');
                previewFrame.classList.remove('hidden');
                previewFrame.srcdoc = currentData.html;
                return;
            }

            previewFrame.classList.add('hidden');
            codeDisplay.parentElement.classList.remove('hidden');

            const languageMap = { html: 'html', css: 'css', js: 'javascript' };
            codeDisplay.className = `language-${languageMap[tabType]}`;
            codeDisplay.textContent = currentData[tabType] || '/* Tidak ada data */';

            Prism.highlightElement(codeDisplay);
        }

        // Live Code Search Filter
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const source = currentData[activeTab] || '';
            if (!term) {
                codeDisplay.textContent = source;
            } else {
                const filtered = source.split('\n').filter(line => line.toLowerCase().includes(term)).join('\n');
                codeDisplay.textContent = filtered;
            }
            Prism.highlightElement(codeDisplay);
        });

        // Copy Code
        document.getElementById('btn-copy').addEventListener('click', () => {
            if (!currentData[activeTab]) return;
            navigator.clipboard.writeText(currentData[activeTab]);
            alert('Kode berhasil disalin ke clipboard!');
        });

        // Download Single File
        document.getElementById('btn-download-single').addEventListener('click', () => {
            if (!currentData[activeTab]) return;
            const extMap = { html: 'html', css: 'css', js: 'js' };
            const blob = new Blob([currentData[activeTab]], { type: 'text/plain;charset=utf-8' });
            saveAs(blob, `extracted-${activeTab}.${extMap[activeTab]}`);
        });

        // Download ZIP
        document.getElementById('btn-download-zip').addEventListener('click', () => {
            if (!currentData.html) return alert('Belum ada data untuk di-download!');
            
            const zip = new JSZip();
            zip.file("index.html", currentData.html);
            zip.file("style.css", currentData.css);
            zip.file("script.js", currentData.js);

            zip.generateAsync({ type: "blob" }).then((content) => {
                saveAs(content, "website-sourcecode.zip");
            });
        });

        // LocalStorage History
        function saveHistory(url) {
            let history = JSON.parse(localStorage.getItem('extractor_history') || '[]');
            if (!history.includes(url)) {
                history.u
